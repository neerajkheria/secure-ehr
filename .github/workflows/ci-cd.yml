name: CI/CD with Security and EB Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bandit (SAST)
      run: |
        pip install bandit
        bandit -r app/

    - name: Run Snyk (SCA)
      uses: snyk/actions/python@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: test

    - name: Build Docker image
      run: docker build -t secure-ehr .

    - name: Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: secure-ehr
        format: table
        exit-code: 1
        ignore-unfixed: true

    - name: Deploy to Elastic Beanstalk
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        APPLICATION_NAME: secure-ehr
        ENVIRONMENT_NAME: secure-ehr-env
      run: |
        zip -r deploy.zip * .[^.]* || true
        pip install awsebcli --upgrade
        eb init $APPLICATION_NAME --region $AWS_REGION -p docker
        eb use $ENVIRONMENT_NAME
        eb deploy
